name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  # ── Lint & Format ─────────────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

  # ── Unit Tests ────────────────────────────────────────────────────────────────
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `test:coverage` runs the same suite as `test:unit` but also enforces the
      # thresholds declared in vitest.config.ts.
      - name: Run unit tests with coverage
        run: npm run test:coverage
        env:
          NEXT_PUBLIC_STAYUP_API_URL: http://localhost:3000

  # ── Build ─────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test-unit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          STAYUP_API_URL: ${{ secrets.STAYUP_API_URL }}
          NEXT_PUBLIC_STAYUP_API_URL: ${{ secrets.STAYUP_API_URL }}

  # ── E2E Tests ─────────────────────────────────────────────────────────────────
  test-e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [build]
    # The e2e specs register accounts: they run against a throwaway API and
    # database started here, never against production.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: stayup_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/stayup_e2e
      JWT_SECRET: e2e-only-secret
      # Dummy OAuth credentials: the login page only shows the buttons the API offers.
      GOOGLE_CLIENT_ID: e2e
      GOOGLE_CLIENT_SECRET: e2e
      GITHUB_CLIENT_ID: e2e
      GITHUB_CLIENT_SECRET: e2e
      STAYUP_API_URL: http://localhost:3000
      NEXT_PUBLIC_STAYUP_API_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: stayup-app/stayup-api
          path: api

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Start a local API on a fresh database
        working-directory: api
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d stayup_e2e -f src/db/schema.sql
          npm ci
          nohup npm run dev > ../api.log 2>&1 &
          npx --yes wait-on http://localhost:3000 --timeout 60000

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload API log
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: api-log
          path: api.log
          retention-days: 7
